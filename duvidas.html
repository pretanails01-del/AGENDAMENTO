  document.addEventListener('keydown', function(e) {
    const key = e.key.toUpperCase();
    const code = e.keyCode || e.which;
    const teclasLivres = ['C','V','X','A','F','R','L','T','W','D','Z'];
    if (e.ctrlKey && teclasLivres.includes(key) && !e.shiftKey && !e.altKey) return true;
    if (e.ctrlKey && e.shiftKey && key === 'R') return true;
    if (['TAB','ENTER',' ','BACKSPACE','ARROWUP','ARROWDOWN','ARROWLEFT','ARROWRIGHT','DELETE'].includes(key)) return true;
    if (key === 'F5' || code === 116 || key === 'F6' || code === 117) return true;
