<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Avaliação Inicial • Preta Nails</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root { --primary: #C13584; --primary-dark: #a02c6e; --success: #25D366; --bg: #0a0a0a; --card: rgba(255,255,255,0.04); --text: #ffffff; --border: rgba(193,53,132,0.25); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: linear-gradient(180deg, #0a0a0a 0%, #050505 100%); min-height: 100vh; padding: 12px; color: var(--text); }
 .container { max-width: 720px; margin: 16px auto; background: var(--card); border: 1px solid var(--border); backdrop-filter: blur(20px); border-radius: 16px; overflow: hidden; }
 .header { background: linear-gradient(135deg, #000 0%, var(--primary) 100%); text-align: center; padding: 50px 20px 40px; }
 .header h1 { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 900; }
 .form-body { padding: 40px 35px; }
 .form-group { margin-bottom: 24px; }
  label { display: block; margin-bottom: 10px; font-weight: 700; color: var(--primary); font-size: 14px; }
  label.required::after { content: ' *'; color: #e74c3c; }
  input, textarea, select { width: 100%; padding: 14px 16px; border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; font-size: 15px; background: rgba(0,0,0,0.3); color: #fff; font-family: 'Inter', sans-serif; }
  input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.4); }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); }
 .checkbox-group { display: flex; flex-direction: column; gap: 10px; background: rgba(0,0,0,0.2); padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); }
 .checkbox-item { display: flex; align-items: center; gap: 10px; }
 .checkbox-item input { width: 18px; height: 18px; accent-color: var(--primary); }
 .hidden { display: none!important; }
 .horario-selecionado { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); padding: 18px; border-radius: 14px; text-align: center; margin-bottom: 25px; border: 2px solid rgba(255,255,255,0.2); }
 .horario-selecionado p { font-size: 18px; font-weight: 800; }
 .signature-wrapper { background: #C13584; border: 2px solid #a02c6e; border-radius: 16px; overflow: hidden; position: relative; }
  #signatureCanvas { background: transparent; width: 100%; height: 180px; display: block; touch-action: none; cursor: crosshair; }
 .sig-actions { display: flex; justify-content: space-between; padding: 10px 14px; background: #a02c6e; }
 .sig-actions button { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; }
 .foto-preview { margin-top: 12px; text-align: center; }
 .foto-preview img { max-width: 100%; max-height: 220px; border-radius: 12px; border: 2px solid var(--primary); }
 .btn-submit { width: 100%; padding: 18px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); border: none; border-radius: 14px; color: #000; font-weight: 800; font-size: 16px; cursor: pointer; letter-spacing: 1px; }
 .btn-submit:disabled { opacity: 0.6; }
 .erro-msg { background: rgba(231,76,60,0.15); border: 1px solid #e74c3c; color: #ff9a9a; padding: 14px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-weight: 700; }
 .loader { width: 18px; height: 18px; border: 2px solid #000; border-top-color: transparent; border-radius: 50%; display: inline-block; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #sucessoOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
 .sucesso-card { background: #121212; border: 1px solid var(--border); border-radius: 20px; padding: 32px; text-align: center; max-width: 420px; width: 100%; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>PRETA NAILS</h1>
    <p>FICHA DE ANAMNESE PROFISSIONAL</p>
  </div>
  <div class="form-body">
    <div id="infoHorario" class="horario-selecionado hidden"><h3>HORÁRIO SELECIONADO</h3><p id="textoHorario"></p></div>
    <div id="erroContainer" class="hidden"></div>
    <form id="anamneseForm">
      <div class="form-group"><label class="required">Nome Completo</label><input type="text" id="nome" required placeholder="Ex: Nicole Silva"></div>
      <div class="form-group" style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div><label class="required">Idade</label><input type="number" id="idade" required placeholder="20"></div>
        <div><label class="required">WhatsApp</label><input type="tel" id="whatsapp" required placeholder="(11) 9XXXX-XXXX"></div>
      </div>
      <div class="form-group"><label class="required">Procedimento</label>
        <div class="checkbox-group" id="procedimentosGroup">
          <label class="checkbox-item"><input type="checkbox" value="Alongamento de Unhas"> Alongamento de Unhas</label>
          <label class="checkbox-item"><input type="checkbox" value="Manutenção"> Manutenção</label>
          <label class="checkbox-item"><input type="checkbox" value="Banho de Gel"> Banho de Gel</label>
          <label class="checkbox-item"><input type="checkbox" value="Esmaltação em Gel"> Esmaltação em Gel</label>
          <label class="checkbox-item"><input type="checkbox" value="Outro" id="outroCheck"> Outro</label>
          <div id="outroContainer" class="hidden"><input type="text" id="outroTexto" placeholder="Qual procedimento?"></div>
        </div>
      </div>
      <div class="form-group" style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div><label>Diabetes?</label><select id="diabetes"><option>Não</option><option>Sim</option></select></div>
        <div><label>Anemia?</label><select id="anemia"><option>Não</option><option>Sim</option></select></div>
      </div>
      <div class="form-group" style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div><label>Mãos Suam?</label><select id="maosSuam"><option>Não</option><option>Sim</option></select></div>
        <div><label>Gestante?</label><select id="gravida"><option>Não</option><option>Sim</option></select></div>
      </div>
      <div class="form-group"><label>Alergias?</label><select id="alergias" onchange="toggleDetalhes(this,'alergias_texto')"><option>Não</option><option>Sim</option></select><textarea id="alergias_texto" class="hidden" placeholder="Qual alergia? Ex: Cxjdksksk" style="margin-top:10px"></textarea></div>
      <div class="form-group"><label>Medicamentos?</label><select id="medicamentos" onchange="toggleDetalhes(this,'medicamentos_texto')"><option>Não</option><option>Sim</option></select><textarea id="medicamentos_texto" class="hidden" placeholder="Quais medicamentos?" style="margin-top:10px"></textarea></div>
      <div class="form-group"><label>Já fez Alongamento?</label><select id="alongamento" onchange="toggleDetalhes(this,'alongamento_texto')"><option>Não</option><option>Sim - Não tive reação</option><option>Sim - Tive reação</option></select><textarea id="alongamento_texto" class="hidden" placeholder="Detalhe..." style="margin-top:10px"></textarea></div>
      <div class="form-group"><label>Observações</label><textarea id="observacoes" placeholder="Nenhuma"></textarea></div>
      <div class="form-group"><label>Foto da Unha (Referência)</label><input type="file" id="foto" accept="image/*" onchange="previewFoto(this)"><div id="previewContainer" class="foto-preview hidden"><img id="previewImg"><br><button type="button" onclick="removerFoto()" style="margin-top:8px;background:#333;color:#fff;border:none;padding:6px 14px;border-radius:20px;cursor:pointer">Remover foto</button></div></div>
      <div class="form-group"><label class="required">Assinatura Digital</label>
        <div class="signature-wrapper"><canvas id="signatureCanvas" width="600" height="220"></canvas><div class="sig-actions"><span style="font-size:11px;color:#fff;opacity:0.8">Assine com o dedo</span><button type="button" onclick="clearSignature()">Limpar</button></div></div>
      </div>
      <button type="submit" class="btn-submit" id="submitBtn"><span id="btnText">CONFIRMAR AGENDAMENTO</span></button>
    </form>
  </div>
</div>

<div id="sucessoOverlay" class="hidden">
  <div class="sucesso-card">
    <div style="font-size:50px;color:#25D366;margin-bottom:14px"><i class="fas fa-check-circle"></i></div>
    <h2 style="color:#fff;margin-bottom:8px">Agendamento Confirmado!</h2>
    <p id="sucessoTexto" style="color:#aaa;margin-bottom:20px"></p>
    <a id="btnWhatsappSucesso" href="#" target="_blank" style="display:block;background:#25D366;color:#fff;padding:14px;border-radius:30px;text-decoration:none;font-weight:800;margin-bottom:10px">Avise no WhatsApp</a>
    <a href="agendamento.html" style="display:block;background:#222;color:#fff;padding:12px;border-radius:30px;text-decoration:none">Voltar ao início</a>
  </div>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxfq9mJSTRXSH36HYYlyG2dXf0iUQ3Iyq3hdKbRsp1G5ImcMBV7bAVXu1zQ0nP5yVX74w/exec";
let fotoBase64 = null;
let isDrawing = false;
let hasSignature = false;
let diaSelecionado = '';
let horaSelecionada = '';

(function pegarHorarioURL(){
  const params = new URLSearchParams(window.location.search);
  diaSelecionado = params.get('dia');
  horaSelecionada = params.get('hora');
  if(diaSelecionado && horaSelecionada){
    document.getElementById('infoHorario').classList.remove('hidden');
    document.getElementById('textoHorario').innerText = `${diaSelecionado} - ${horaSelecionada}`;
  }
})();

function previewFoto(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('previewImg').src = e.target.result;
      document.getElementById('previewContainer').classList.remove('hidden');
      fotoBase64 = e.target.result;
    }
    reader.readAsDataURL(input.files[0]);
  }
}
function removerFoto() {
  document.getElementById('previewContainer').classList.add('hidden');
  document.getElementById('foto').value = '';
  fotoBase64 = null;
}
document.getElementById('outroCheck').addEventListener('change', function() {
  const container = document.getElementById('outroContainer');
  const campo = document.getElementById('outroTexto');
  if (this.checked) { container.classList.remove('hidden'); campo.required = true; }
  else { container.classList.add('hidden'); campo.required = false; campo.value = ''; }
});

const canvas = document.getElementById('signatureCanvas');
const ctx = canvas.getContext('2d');
ctx.strokeStyle = '#000000';
ctx.lineWidth = 3;
ctx.lineCap = 'round';
ctx.lineJoin = 'round';
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  if (e.touches) { return { x: (e.touches[0].clientX - rect.left) * scaleX, y: (e.touches[0].clientY - rect.top) * scaleY }; }
  return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}
function startDraw(e) { isDrawing = true; hasSignature = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); e.preventDefault(); }
function draw(e) { if (!isDrawing) return; const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); e.preventDefault(); }
function endDraw() { isDrawing = false; }
canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', endDraw);
canvas.addEventListener('mouseleave', endDraw);
canvas.addEventListener('touchstart', startDraw, {passive:false});
canvas.addEventListener('touchmove', draw, {passive:false});
canvas.addEventListener('touchend', endDraw);
function clearSignature() { ctx.clearRect(0, 0, canvas.width, canvas.height); hasSignature = false; }
function getAssinaturaLimpa() {
  const temp = document.createElement('canvas');
  temp.width = canvas.width;
  temp.height = canvas.height;
  const tCtx = temp.getContext('2d');
  tCtx.fillStyle = '#FFFFFF';
  tCtx.fillRect(0,0,temp.width,temp.height);
  tCtx.drawImage(canvas,0,0);
  return temp.toDataURL('image/png');
}
function toggleDetalhes(select, textareaId) {
  const textarea = document.getElementById(textareaId);
  if (select.value === 'Sim' || select.value.includes('Sim')) { textarea.classList.remove('hidden'); textarea.required = true; }
  else { textarea.classList.add('hidden'); textarea.required = false; textarea.value = ''; }
}
function showErro(msg) {
  const container = document.getElementById('erroContainer');
  container.innerHTML = `<div class="erro-msg"><i class="fas fa-exclamation-triangle"></i> ${msg}</div>`;
  container.classList.remove('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('whatsapp').addEventListener('input', function(e) {
  let v = e.target.value.replace(/\D/g,'').substring(0,11);
  if(v.length<=2) e.target.value=v;
  else if(v.length<=7) e.target.value=`(${v.substring(0,2)}) ${v.substring(2)}`;
  else e.target.value=`(${v.substring(0,2)}) ${v.substring(2,7)}-${v.substring(7)}`;
});
document.getElementById('anamneseForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  document.getElementById('erroContainer').classList.add('hidden');
  if (!hasSignature) { showErro('Assinatura obrigatória'); return; }
  if(!diaSelecionado||!horaSelecionada){ showErro('Volte e escolha horário'); return; }
  let procs = [];
  document.querySelectorAll('#procedimentosGroup input[type="checkbox"]:checked').forEach(c => {
    if (c.value === 'Outro') { const outro = document.getElementById('outroTexto').value.trim(); if(outro) procs.push(`Outro: ${outro}`); }
    else procs.push(c.value);
  });
  if (procs.length === 0) { showErro('Selecione procedimento'); return; }
  const btn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');
  btn.disabled = true; btnText.innerHTML = '<span class="loader"></span> Enviando...';
  const dados = {
    nome: document.getElementById('nome').value.trim(),
    idade: document.getElementById('idade').value,
    whatsapp: document.getElementById('whatsapp').value.trim(),
    dia: diaSelecionado,
    hora: horaSelecionada,
    diabetes: document.getElementById('diabetes').value,
    anemia: document.getElementById('anemia').value,
    suor: document.getElementById('maosSuam').value,
    gravida: document.getElementById('gravida').value,
    procedimento: procs.join(", "),
    fotoMao: fotoBase64,
    assinatura: getAssinaturaLimpa(),
    alergias: document.getElementById('alergias').value,
    alergias_texto: document.getElementById('alergias_texto').value,
    medicamentos: document.getElementById('medicamentos').value,
    medicamentos_texto: document.getElementById('medicamentos_texto').value,
    alongamento: document.getElementById('alongamento').value,
    alongamento_texto: document.getElementById('alongamento_texto').value,
    observacoes: document.getElementById('observacoes').value
  };
  try {
    const response = await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(dados) });
    const data = await response.json();
    if (data.result === 'success' || data.status === 'ok' || data.id) {
      document.getElementById('sucessoTexto').innerHTML = `Ficha <strong>${data.id||''}</strong> enviada! PDF gerado.`;
      const mensagem = `🔥 NOVO FORMULÁRIO - PRETA NAILS\n\n👤 Cliente: ${dados.nome}\n📱 WhatsApp: ${dados.whatsapp}\n📅 ${dados.dia} ${dados.hora}\n💅 ${dados.procedimento}\n📋 OS: ${data.id||''}\n\n📄 PDF: ${data.pdf||''}`;
      document.getElementById('btnWhatsappSucesso').href = `https://wa.me/5511982311608?text=${encodeURIComponent(mensagem)}`;
      document.getElementById('sucessoOverlay').classList.remove('hidden');
    } else { throw new Error(); }
  } catch (err) {
    showErro('Erro ao enviar. Tente novamente.');
  } finally {
    btn.disabled = false; btnText.textContent = 'CONFIRMAR AGENDAMENTO';
  }
});
</script>
</body>
</html>
